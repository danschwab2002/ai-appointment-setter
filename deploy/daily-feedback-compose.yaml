services:
  daily-feedback:
    build:
      context: ..
      dockerfile: deploy/daily-feedback.Dockerfile
    environment:
      DAILY_FEEDBACK_PUBLIC_ORIGIN: ${DAILY_FEEDBACK_PUBLIC_ORIGIN:?required}
      DAILY_FEEDBACK_REAL_CONVERSATIONS_ENABLED: ${DAILY_FEEDBACK_REAL_CONVERSATIONS_ENABLED:?required}
      DAILY_FEEDBACK_STORAGE_ENCRYPTION_VERIFIED: ${DAILY_FEEDBACK_STORAGE_ENCRYPTION_VERIFIED:?required}
      DAILY_FEEDBACK_STORAGE_ENCRYPTION_EVIDENCE_REF: ${DAILY_FEEDBACK_STORAGE_ENCRYPTION_EVIDENCE_REF:?required}
      DAILY_FEEDBACK_RETENTION_HOURS: ${DAILY_FEEDBACK_RETENTION_HOURS:?required}
      DAILY_FEEDBACK_DELETION_POLICY_REF: ${DAILY_FEEDBACK_DELETION_POLICY_REF:?required}
      DAILY_FEEDBACK_REVIEWERS_JSON: ${DAILY_FEEDBACK_REVIEWERS_JSON:?required}
      DAILY_FEEDBACK_MANUAL_RUN_TOKEN: ${DAILY_FEEDBACK_MANUAL_RUN_TOKEN:?required}
      DAILY_FEEDBACK_WORKER_ID: ${DAILY_FEEDBACK_WORKER_ID:?required}
      DAILY_FEEDBACK_PSEUDONYMIZATION_KEY: ${DAILY_FEEDBACK_PSEUDONYMIZATION_KEY:?required}
      SUPABASE_BASE_URL: ${SUPABASE_BASE_URL:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      SLACK_OIDC_CLIENT_ID: ${SLACK_OIDC_CLIENT_ID:?required}
      SLACK_OIDC_CLIENT_SECRET: ${SLACK_OIDC_CLIENT_SECRET:?required}
      SLACK_OIDC_TEAM_ID: ${SLACK_OIDC_TEAM_ID:?required}
      SLACK_CONNECTOR_BASE_URL: ${SLACK_CONNECTOR_BASE_URL:?required}
      SLACK_CONNECTOR_BEARER_TOKEN: ${SLACK_CONNECTOR_BEARER_TOKEN:?required}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL:?required}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID:?required}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:?required}
      CHATWOOT_AGENT_BOT_ID: ${CHATWOOT_AGENT_BOT_ID:?required}
      CHATWOOT_API_ACCESS_TOKEN: ${CHATWOOT_API_ACCESS_TOKEN:?required}
      DAILY_FEEDBACK_TENANT_REF: ${DAILY_FEEDBACK_TENANT_REF:?required}
      DAILY_FEEDBACK_SCOPE_REF: ${DAILY_FEEDBACK_SCOPE_REF:?required}
      DAILY_FEEDBACK_SLACK_TENANT_REF: ${DAILY_FEEDBACK_SLACK_TENANT_REF:?required}
      DAILY_FEEDBACK_TIMEZONE: ${DAILY_FEEDBACK_TIMEZONE:?required}
      DAILY_FEEDBACK_DAILY_AT: ${DAILY_FEEDBACK_DAILY_AT:?required}
      DAILY_FEEDBACK_SCHEDULER_ENABLED: ${DAILY_FEEDBACK_SCHEDULER_ENABLED:-false}
      DAILY_FEEDBACK_POLL_INTERVAL_SECONDS: ${DAILY_FEEDBACK_POLL_INTERVAL_SECONDS:-30}
    deploy:
      replicas: 1
      update_config:
        order: stop-first
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
