services:
  slack-connector:
    build:
      context: ..
      dockerfile: deploy/slack-connector.Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        order: stop-first
    environment:
      SLACK_INGRESS_ENABLED: ${SLACK_INGRESS_ENABLED:-false}
      SLACK_NOTIFICATIONS_ENABLED: ${SLACK_NOTIFICATIONS_ENABLED:-false}
      SLACK_INTERACTIONS_ENABLED: ${SLACK_INTERACTIONS_ENABLED:-false}
      SLACK_CORRELATION_BACKFILL_ENABLED: ${SLACK_CORRELATION_BACKFILL_ENABLED:-false}
      SLACK_CONNECTIVITY_CHECK_ENABLED: ${SLACK_CONNECTIVITY_CHECK_ENABLED:-false}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_TEAM_ID: ${SLACK_TEAM_ID:-}
      SLACK_TENANT_CHANNELS_JSON: ${SLACK_TENANT_CHANNELS_JSON:-}
      SLACK_TENANT_TOKENS_JSON: ${SLACK_TENANT_TOKENS_JSON:-}
      SLACK_TENANT_OPERATOR_USER_IDS_JSON: ${SLACK_TENANT_OPERATOR_USER_IDS_JSON:-}
      SLACK_TENANT_OPERATOR_BACKENDS_JSON: ${SLACK_TENANT_OPERATOR_BACKENDS_JSON:-}
      SLACK_STORAGE_PATH: /app/data/slack-connector.sqlite3
      SLACK_WORKER_ID: ${SLACK_WORKER_ID:-slack-worker-1}
      SLACK_POLL_INTERVAL_SECONDS: ${SLACK_POLL_INTERVAL_SECONDS:-1}
      SLACK_MAX_NONTERMINAL_NOTIFICATIONS: ${SLACK_MAX_NONTERMINAL_NOTIFICATIONS:-10000}
      SLACK_STORAGE_PREFLIGHT_ENABLED: ${SLACK_STORAGE_PREFLIGHT_ENABLED:-true}
      SLACK_ACTIVATION_MODE: ${SLACK_ACTIVATION_MODE:-inactive}
      SLACK_ACTIVATION_GENERATION: ${SLACK_ACTIVATION_GENERATION:-0}
      SLACK_OPERATOR_BEARER_TOKEN: ${SLACK_OPERATOR_BEARER_TOKEN:-}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - slack-connector-data:/app/data

volumes:
  slack-connector-data:
