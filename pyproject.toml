[project]
name = "ai-appointment-setter"
version = "0.1.0"
description = "Bridge between Chatwoot, Hermes Agent and Evolution API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "phonenumbers>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bridge"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
