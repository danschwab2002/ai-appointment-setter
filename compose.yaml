services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET}
      CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      CHATWOOT_CONTROL_API_ACCESS_TOKEN: ${CHATWOOT_CONTROL_API_ACCESS_TOKEN}
      CHATWOOT_AGENT_BOT_ID: ${CHATWOOT_AGENT_BOT_ID}
      CHATWOOT_AGENT_BOT_ACCESS_TOKEN: ${CHATWOOT_AGENT_BOT_ACCESS_TOKEN:-}
      CHATWOOT_PAUSE_MACRO_ID: ${CHATWOOT_PAUSE_MACRO_ID}
      CHATWOOT_HUMAN_PAUSE_ENABLED: ${CHATWOOT_HUMAN_PAUSE_ENABLED:-false}
      ALLOWED_WHATSAPP_JID: ${ALLOWED_WHATSAPP_JID}
      CAPTURE_DIR: /app/data/captures
      WEBHOOK_MAX_AGE_SECONDS: ${WEBHOOK_MAX_AGE_SECONDS:-300}
      HERMES_SHADOW_ENABLED: ${HERMES_SHADOW_ENABLED:-false}
      HERMES_API_BASE_URL: ${HERMES_API_BASE_URL:-}
      HERMES_API_KEY: ${HERMES_API_KEY:-}
      HERMES_MODEL_NAME: ${HERMES_MODEL_NAME:-agente-comercial}
      SHADOW_DIR: /app/data/shadow
      CHATWOOT_AUTOMATED_REPLIES_ENABLED: ${CHATWOOT_AUTOMATED_REPLIES_ENABLED:-false}
      CHATWOOT_INBOUND_DEBOUNCE_SECONDS: ${CHATWOOT_INBOUND_DEBOUNCE_SECONDS:-30}
      CHATWOOT_CUT_B_ADMISSION_ENABLED: ${CHATWOOT_CUT_B_ADMISSION_ENABLED:-false}
      CHATWOOT_CUT_B_SCOPE_KEY: ${CHATWOOT_CUT_B_SCOPE_KEY:-}
      CHATWOOT_CUT_B_SCOPE_VERSION: ${CHATWOOT_CUT_B_SCOPE_VERSION:-}
      CHATWOOT_CUT_B_AGENT_ENABLED: ${CHATWOOT_CUT_B_AGENT_ENABLED:-false}
      CHATWOOT_REPLY_SPLITTER_ENABLED: ${CHATWOOT_REPLY_SPLITTER_ENABLED:-false}
      CHATWOOT_REPLY_PART_DELAY_SECONDS: ${CHATWOOT_REPLY_PART_DELAY_SECONDS:-2}
      HERMES_REPLY_SPLITTER_PROVIDER: ${HERMES_REPLY_SPLITTER_PROVIDER:-}
      HERMES_REPLY_SPLITTER_MODEL_NAME: ${HERMES_REPLY_SPLITTER_MODEL_NAME:-}
      REPLY_DIR: /app/data/replies
      HOTMART_HOTTOK: ${HOTMART_HOTTOK:-}
      HOTMART_MAX_AGE_SECONDS: ${HOTMART_MAX_AGE_SECONDS:-300}
      HOTMART_PURCHASE_WORKER_ENABLED: ${HOTMART_PURCHASE_WORKER_ENABLED:-false}
      HOTMART_ABANDONMENT_TIMER_WORKER_ENABLED: ${HOTMART_ABANDONMENT_TIMER_WORKER_ENABLED:-false}
      HOTMART_ABANDONMENT_TIMER_POLL_INTERVAL: ${HOTMART_ABANDONMENT_TIMER_POLL_INTERVAL:-5.0}
      HOTMART_ABANDONMENT_TIMER_BATCH_SIZE: ${HOTMART_ABANDONMENT_TIMER_BATCH_SIZE:-10}
      PRECHECKOUT_FORM_ENABLED: ${PRECHECKOUT_FORM_ENABLED:-false}
      PRECHECKOUT_FORM_TOKEN: ${PRECHECKOUT_FORM_TOKEN:-}
      PRECHECKOUT_TEST_MODE_ENABLED: ${PRECHECKOUT_TEST_MODE_ENABLED:-false}
      PRECHECKOUT_TEST_PHONE_E164: ${PRECHECKOUT_TEST_PHONE_E164:-}
      PRECHECKOUT_MAX_AGE_SECONDS: ${PRECHECKOUT_MAX_AGE_SECONDS:-300}
      LEAD_PRECHECKOUT_ENABLED: ${LEAD_PRECHECKOUT_ENABLED:-false}
      LEAD_PRECHECKOUT_SECRET: ${LEAD_PRECHECKOUT_SECRET:-}
      LEAD_PRECHECKOUT_MAX_AGE_SECONDS: ${LEAD_PRECHECKOUT_MAX_AGE_SECONDS:-300}
      LEAD_PRECHECKOUT_SITE: ${LEAD_PRECHECKOUT_SITE:-psicologajohanna}
      LEAD_PRECHECKOUT_LANDING_ID: ${LEAD_PRECHECKOUT_LANDING_ID:-ads-a}
      LEAD_PRECHECKOUT_OFFER_CODE: ${LEAD_PRECHECKOUT_OFFER_CODE:-bxjge6zq}
      PRECHECKOUT_FIRST_TOUCH_ENABLED: ${PRECHECKOUT_FIRST_TOUCH_ENABLED:-false}
      PRECHECKOUT_FIRST_TOUCH_TOKEN: ${PRECHECKOUT_FIRST_TOUCH_TOKEN:-}
      JOHANNA_ABANDONMENT_ONE_SHOT_ENABLED: ${JOHANNA_ABANDONMENT_ONE_SHOT_ENABLED:-false}
      JOHANNA_ABANDONMENT_ONE_SHOT_TOKEN: ${JOHANNA_ABANDONMENT_ONE_SHOT_TOKEN:-}
      JOHANNA_ABANDONMENT_HOTMART_AUTO_ENABLED: ${JOHANNA_ABANDONMENT_HOTMART_AUTO_ENABLED:-false}
      SUPABASE_BASE_URL: ${SUPABASE_BASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      RESOLUTION_WORKER_ENABLED: ${RESOLUTION_WORKER_ENABLED:-false}
      RESOLUTION_WORKER_POLL_INTERVAL: ${RESOLUTION_WORKER_POLL_INTERVAL:-5.0}
      RESOLUTION_WORKER_BATCH_SIZE: ${RESOLUTION_WORKER_BATCH_SIZE:-10}
      FOLLOWUP_POLICY_KEY: ${FOLLOWUP_POLICY_KEY:-}
      FOLLOWUP_POLICY_VERSION: ${FOLLOWUP_POLICY_VERSION:-}
      LANCEMOS_PILOT_BOUNDARY_ENABLED: ${LANCEMOS_PILOT_BOUNDARY_ENABLED:-false}
      LANCEMOS_PILOT_SCOPE_KEY: ${LANCEMOS_PILOT_SCOPE_KEY:-}
      LANCEMOS_PILOT_SCOPE_VERSION: ${LANCEMOS_PILOT_SCOPE_VERSION:-}
      LANCEMOS_PILOT_TENANT_KEY: ${LANCEMOS_PILOT_TENANT_KEY:-}
      LANCEMOS_PILOT_CHANNEL_PROVIDER: ${LANCEMOS_PILOT_CHANNEL_PROVIDER:-}
      LANCEMOS_PILOT_CHANNEL_ACCOUNT_REF: ${LANCEMOS_PILOT_CHANNEL_ACCOUNT_REF:-}
      WABA_FIRST_TOUCH_TEMPLATE_NAME: ${WABA_FIRST_TOUCH_TEMPLATE_NAME:-}
      WABA_FOLLOWUP_TEMPLATE_NAME: ${WABA_FOLLOWUP_TEMPLATE_NAME:-}
      WABA_TEMPLATE_LANGUAGE: ${WABA_TEMPLATE_LANGUAGE:-}
      WABA_TEMPLATE_CATEGORY: ${WABA_TEMPLATE_CATEGORY:-}
      DURABLE_DISPATCHER_ENABLED: ${DURABLE_DISPATCHER_ENABLED:-false}
      DURABLE_OUTBOUND_ENABLED: ${DURABLE_OUTBOUND_ENABLED:-false}
      DURABLE_DISPATCHER_WORKER_ID: ${DURABLE_DISPATCHER_WORKER_ID:-}
      DURABLE_DISPATCHER_POLL_INTERVAL: ${DURABLE_DISPATCHER_POLL_INTERVAL:-5.0}
      DURABLE_DISPATCHER_BATCH_SIZE: ${DURABLE_DISPATCHER_BATCH_SIZE:-10}
      HUMAN_HANDOFF_ADMISSION_ENABLED: ${HUMAN_HANDOFF_ADMISSION_ENABLED:-false}
      HUMAN_HANDOFF_PROJECTION_ENABLED: ${HUMAN_HANDOFF_PROJECTION_ENABLED:-false}
      HUMAN_HANDOFF_PROJECTION_WORKER_ID: ${HUMAN_HANDOFF_PROJECTION_WORKER_ID:-}
      HUMAN_HANDOFF_PROJECTION_POLL_INTERVAL: ${HUMAN_HANDOFF_PROJECTION_POLL_INTERVAL:-5.0}
      HUMAN_HANDOFF_PROJECTION_BATCH_SIZE: ${HUMAN_HANDOFF_PROJECTION_BATCH_SIZE:-10}
      HUMAN_HANDOFF_PROJECTION_LEASE_SECONDS: ${HUMAN_HANDOFF_PROJECTION_LEASE_SECONDS:-60}
      HUMAN_HANDOFF_PROJECTION_MAX_ATTEMPTS: ${HUMAN_HANDOFF_PROJECTION_MAX_ATTEMPTS:-8}
      HANDOFF_PROJECTION_POLICY_KEY: ${HANDOFF_PROJECTION_POLICY_KEY:-}
      HANDOFF_PROJECTION_POLICY_VERSION: ${HANDOFF_PROJECTION_POLICY_VERSION:-}
      MESSAGING_CHANNEL: ${MESSAGING_CHANNEL:-evolution}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID:-}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    volumes:
      - bridge-data:/app/data

volumes:
  bridge-data:
