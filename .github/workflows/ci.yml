name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Validate repository coordination invariants
        run: uv run python scripts/agent_workspace.py validate-tree
      - name: Run Python test suite
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/sql/followup_engine/package-lock.json
      - name: Run SQL behavioral suite
        working-directory: tests/sql/followup_engine
        run: npm ci && npm test && node validate_pilot_boundary.mjs && node validate_pilot_boundary_runtime.mjs
      - name: Verify handoff request-start races on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: >-
          uv run python tests/sql/followup_engine/validate_handoff_postgres.py
          --pg-bin /usr/bin --host 127.0.0.1 --port 5432
      - name: Verify observed lead admission on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/observed_lead_precheckout_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: observed-lead-precheckout
        run: >-
          createdb -h 127.0.0.1 -p 5432 observed_lead_precheckout_ci
          && uv run python tests/sql/followup_engine/real_postgres_observed_lead.py
