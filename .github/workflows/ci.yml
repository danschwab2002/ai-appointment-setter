name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # verify es el check requerido de main: junta los jobs de abajo y pasa solo si
  # pasaron todos. La suite de PGlite corre en tandas (run_shard.mjs) y el resto
  # en un job aparte, en paralelo (claude-ci-split-v1).
  python-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Validate repository coordination invariants
        run: uv run python scripts/agent_workspace.py validate-tree
      - name: Run Python test suite
        run: uv run pytest -q
      - name: Verify handoff request-start races on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
        run: >-
          uv run python tests/sql/followup_engine/validate_handoff_postgres.py
          --pg-bin /usr/bin --host 127.0.0.1 --port 5432
      - name: Verify observed lead admission on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/observed_lead_precheckout_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: observed-lead-precheckout
        run: >-
          createdb -h 127.0.0.1 -p 5432 observed_lead_precheckout_ci
          && uv run python tests/sql/followup_engine/real_postgres_observed_lead.py
      - name: Verify Hotmart purchase-intent correlation on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/hotmart_intent_correlation_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: hotmart-intent-correlation
        run: >-
          createdb -h 127.0.0.1 -p 5432 hotmart_intent_correlation_ci
          && uv run python tests/sql/followup_engine/real_postgres_hotmart_intent_correlation.py
      - name: Verify portable first contact on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/portable_precheckout_first_contact_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: portable-precheckout-first-contact
        run: >-
          createdb -h 127.0.0.1 -p 5432 portable_precheckout_first_contact_ci
          && uv run python tests/sql/followup_engine/real_postgres_portable_precheckout_first_contact.py
      - name: Verify portable inbound template adoption on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/portable_inbound_adoption_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: portable-inbound-adoption
        run: >-
          createdb -h 127.0.0.1 -p 5432 portable_inbound_adoption_ci
          && uv run python tests/sql/followup_engine/real_postgres_portable_inbound_adoption.py
      - name: Verify flow store races on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/flow_store_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: flow-store
        run: >-
          createdb -h 127.0.0.1 -p 5432 flow_store_ci
          && uv run python tests/sql/followup_engine/real_postgres_flow_store.py
      - name: Verify the flow store operator command on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/flow_store_operator_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: flow-store
        run: >-
          createdb -h 127.0.0.1 -p 5432 flow_store_operator_ci
          && uv run python tests/sql/followup_engine/real_postgres_flow_change_operator.py
      - name: Verify the inbox change of an instance (binding version) on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/flow_store_inbox_binding_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: flow-store
        run: >-
          createdb -h 127.0.0.1 -p 5432 flow_store_inbox_binding_ci
          && uv run python tests/sql/followup_engine/real_postgres_inbox_binding_version.py
      - name: Verify adding offers to a running instance on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/flow_store_add_offers_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: flow-store
        run: >-
          createdb -h 127.0.0.1 -p 5432 flow_store_add_offers_ci
          && uv run python tests/sql/followup_engine/real_postgres_add_instance_offers.py
      - name: Verify flow engine route races on PostgreSQL
        env:
          PGUSER: postgres
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres@127.0.0.1:5432/flow_store_engine_ci
          PSQL: /usr/bin/psql
          ALLOW_DISPOSABLE_DATABASE: flow-store
        run: >-
          createdb -h 127.0.0.1 -p 5432 flow_store_engine_ci
          && uv run python tests/sql/followup_engine/real_postgres_flow_engine.py

  sql-pglite:
    name: sql-pglite (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/sql/followup_engine/package-lock.json
      - name: Run SQL behavioral suite (shard ${{ matrix.shard }} of 3)
        working-directory: tests/sql/followup_engine
        run: >-
          npm ci
          && node run_shard.mjs --shard ${{ matrix.shard }} --of 3
          --also validate_pilot_boundary.mjs
          --also validate_pilot_boundary_runtime.mjs

  # always() a proposito: con !cancelled(), un verify salteado cuenta como
  # pasado para branch protection, y cancelar la corrida habilitaria el merge
  # sin tests. El costo es un verify rojo en el commit viejo cuando un push
  # nuevo cancela la corrida anterior.
  verify:
    needs: [python-and-postgres, sql-pglite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to pass
        env:
          PYTHON_AND_POSTGRES: ${{ needs.python-and-postgres.result }}
          SQL_PGLITE: ${{ needs.sql-pglite.result }}
        run: |
          echo "python-and-postgres: $PYTHON_AND_POSTGRES"
          echo "sql-pglite: $SQL_PGLITE"
          test "$PYTHON_AND_POSTGRES" = success && test "$SQL_PGLITE" = success
