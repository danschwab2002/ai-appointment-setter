name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Validate repository coordination invariants
        run: uv run python scripts/agent_workspace.py validate-tree
      - name: Run Python test suite
        run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/sql/followup_engine/package-lock.json
      - name: Run SQL behavioral suite
        working-directory: tests/sql/followup_engine
        run: npm ci && npm test && node validate_pilot_boundary.mjs && node validate_pilot_boundary_runtime.mjs
