name: Release

# Publica las imagenes del producto en GHCR cuando se empuja un tag vX.Y.Z.
# Diseno: docs/design/setter-producto-instalable-v1.md §4.1 (ADR-0021).
# Una instancia usa la imagen por tag; volver atras es volver al tag anterior.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        name: El tag coincide con pyproject y CHANGELOG, y esta en main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          project_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' pyproject.toml | head -1)"
          if [ "$project_version" != "$version" ]; then
            echo "::error::pyproject.toml dice $project_version y el tag es $tag"
            exit 1
          fi
          if ! grep -qE "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md no tiene la entrada ## [$version]"
            exit 1
          fi
          git fetch -q origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::el tag $tag apunta a $GITHUB_SHA, que no esta en main"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  images:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: setter-bridge
            dockerfile: Dockerfile
          - image: setter-slack-connector
            dockerfile: deploy/slack-connector.Dockerfile
          - image: setter-daily-feedback
            dockerfile: deploy/daily-feedback.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            SETTER_VERSION=${{ needs.gate.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:v${{ needs.gate.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.gate.outputs.version }}
      - name: Guardar el digest
        run: |
          mkdir -p digests
          echo "${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:v${{ needs.gate.outputs.version }}@${{ steps.build.outputs.digest }}" > "digests/${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}.txt

  release:
    needs: [gate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Crear la release con el changelog y los digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.gate.outputs.version }}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Imagenes"
            echo
            echo '```text'
            cat digests/*.txt
            echo '```'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
