name: automation-expert-change
version: "0.12.0"
description: Proponer y validar un cambio de flujo (flow-change-cycle-v1), dejar el link para aprobarlo en la pagina del bridge, pasar el link de esa pagina sin propuesta, sumar a alguien al grupo de prueba de un flujo en cohorte (solo un aprobador), leer el catalogo de plantillas y las propuestas con su estado, leer y crear etiquetas de Chatwoot (sumarle una a una conversacion) y leer sus macros, armar el borrador de un masivo y leer su estado (la lista se sube y el envio se confirma en la pagina), y pausar y reanudar al agente comercial para todas, por etiqueta o por producto (solo a pedido de un aprobador; frenar no manda nada), y proponer y leer la instruccion temporal para todas las conversaciones (se aprueba y se retira en la pagina), y pedir una exportacion de contactos (el CSV lo baja un aprobador en la pagina). Nunca aprueba, publica, confirma, arranca, retira ni borra, y no frena flujos, campanas ni masivos.
author: ai-appointment-setter
provides_tools:
  - get_flow_definitions
  - propose_flow_change
  - validate_flow_change
  - get_flow_change
  - list_flow_changes
  - list_templates
  - propose_template
  - validate_template
  - list_template_requests
  - get_template_request
  - list_chatwoot_labels
  - create_chatwoot_label
  - add_chatwoot_label_to_conversation
  - list_chatwoot_macros
  - create_chatwoot_label_macro
  - preview_campaign
  - propose_campaign
  - validate_campaign
  - get_campaign
  - list_campaigns
  - get_approval_page
  - add_to_test_group
  - propose_bulk_send
  - get_bulk_send
  - list_bulk_sends
  - pausar_agente
  - reanudar_agente
  - estado_pausa
  - preview_temporary_instruction
  - propose_temporary_instruction
  - get_temporary_instruction
  - list_temporary_instructions
  - export_contacts
  - get_contact_export
provides_hooks:
  - pre_tool_call
requires_env:
  - AUTOMATION_EXPERT_API_URL
  - AUTOMATION_EXPERT_CHANGE_API_TOKEN
