# 2026-10-15 20:07:28Z. Origen: setter-instancia-att1, conocimiento/knowledge-v7.toml en
# 48d77f4 (instancia#57). /ready de ATT1: commercial_knowledge v7:ac5cc64fbcad... Sirve para
# fijar que la forma de un solo producto se renderiza igual, byte a byte.
#
# Conocimiento del agente comercial de ATT1 (Alimenta Tu Tiroides, Dra. Nina Garza), version 7.
# Contrato: docs/contracts/commercial-knowledge-v1.md del repo del producto (la seccion [pagos],
# desde el producto v1.6.0: un bridge anterior no carga este archivo).
#
# El bridge renderiza este archivo y lo manda al agente en cada pedido. Lo que no esta aca
# no esta confirmado y el agente deriva. Los comentarios (#) no llegan al agente: ahi van las fuentes.
#
# La v7 parte de knowledge-v6.toml (aprobado por Dan el 2026-10-15) y cambia solo la salud, sin tocar
# el producto ni el SOUL:
#   SALUD-V7 = la decision de Dan del 2026-10-15 (≈15:25Z), que reemplaza a SALUD-V6 (decisiones/
#              2026-10-15-el-codigo-de-salud-del-agente-de-att1.md en el vault): el v6 derivaba casi todo
#              mensaje de salud, y al derivar el bridge no le manda nada a la persona (app.py:5138-5142
#              de la v1.8.0). Lo que hay que evitar del todo es dar recomendaciones medicas, y se deriva a
#              quien llega desesperado. Cuatro pasos en orden, el primero que se cumple decide:
#              (1) emergencia: atencion medica, sin derivar; (2) angustia o desesperacion: deriva;
#              (3) embarazo, lactancia, menores, cancer de tiroides, hipertiroidismo o nodulos: deriva
#              («el equipo no tiene ninguna postura por ahora»); (4) pide una recomendacion medica: la
#              primera vez contesta que no puede darlas y que lo decide su medico; si insiste, deriva
#              («el agente tiene que al menos contestar una vez [...] y si la persona insiste, ahi si
#              deriva»). Lo demas se contesta normal. Fuente: las siete conversaciones de salud o de la
#              doctora del 09 al 14/10 (27, 36, 63, 125, 156, 172 y 182), todas derivadas.
#   GUARDA   = en el mismo PR, [guardas] de instancia.toml queda solo con dejar, suspender e
#              interrumpir (decision de Dan del 15/10): el arnes no la prueba, porque corre en el bridge.
#   LUGAR-V7 = los tres «No...» de medicacion, analisis y suplementos se juntan en uno, y la regla de
#              «bajar de peso» pasa a cubrir cualquier «¿me va a servir?».
#
# La v6 parte de knowledge-v5.toml (aprobado por Dan el 2026-10-13) y cambia solo lo de MRT, sin tocar
# el producto ni el SOUL:
#   MRT-V6   = la decision de Dan del 2026-10-15 (≈00:20Z), despues de leer por que el agente derivo la
#              conversacion 172 (pidio saber mas de MRT y el v5 lo mandaba a derivar): (1) a quien pide
#              consulta, seguimiento o contacto con la doctora, o pregunta por MRT, el agente le comparte
#              la pagina de MRT: solo el enlace, sin el precio escrito, y le avisa que el precio es
#              dinamico y que lo confirme en la pagina de pago final; (2) la agenda medica de la doctora
#              esta llena y no se toman citas nuevas, lo que contesto Mariana en la 182 (14/10 20:00Z);
#              reemplaza lo que el agente deducia del v5 («no ofrece consultas individuales en ningun
#              programa», en la 146); (3) el enlace lleva utm_source=hermes, utm_medium=whatsapp y
#              utm_campaign=att1, para contar las ventas.
#   PAGINA   = www.metodoraizana.com/mrt/oferta, la que mando Mariana en la 146 (13/10 20:05Z), leida el
#              2026-10-15 ≈00:00Z: los modulos del programa a su ritmo, tres meses de sesiones grupales
#              en vivo (una vez al mes con la doctora y otras con su equipo de salud funcional,
#              psicologia y mindfulness) y una comunidad privada. Mariana, en la 146: «encuentros
#              grupales con ella cada mes y cada semana con un experto». El precio no se copia: la pagina
#              muestra USD 397 o 3 cuotas de USD 149 «mas impuestos locales», con tres ofertas de
#              Hotmart en el checkout L96106509R, y Dan lo dio por dinamico.
#   ATRIBUCION = medido el 2026-10-15 ≈00:15Z con un navegador sin interfaz y la analitica bloqueada
#              (evidencia/2026-10-15-links-de-pago-de-mrt.md): abierta con esos utm, la pagina arma sus
#              tres links de pago con src=hermes y sck=hermes_whatsapp_att1_na; sin parametros, sin
#              src. Hotmart guarda el src de cada venta y su API lo devuelve. El enlace es el mismo para
#              todos: se sabe que la venta vino del agente, no de que conversacion, y la instancia no
#              recibe las ventas de MRT (otro producto): se cuentan por la API de Hotmart.
#   SALUD-V6 = la decision de Dan del 2026-10-15 (≈01:35Z), al revisar la prueba: los casos de salud
#              delicados se derivan, sin enlace (en la primera prueba, a quien queria que la doctora viera
#              sus analisis a veces le llegaba la pagina de MRT en el mismo mensaje del limite de salud).
#              El criterio, una sola pregunta para el agente: ¿le pide una opinion sobre su salud o le
#              cuenta su caso clinico (analisis, estudios, sintomas, medicacion, dosis, un diagnostico o
#              una condicion)? Si es asi, deriva sin enlace ni MRT, aunque pida hablar con la doctora.
#              Decir que tiene hipotiroidismo o Hashimoto no cuenta: es el publico. Las urgencias no se
#              derivan, porque al derivar el bridge no le manda nada a la persona (app.py:5138-5142 de
#              la v1.6.1): se le dice que busque atencion medica. «¿Me va a servir para bajar de peso?»,
#              sin su caso clinico, sigue como en la v5: no se evalua por chat, sin enlace en ese mensaje.
#   LUGAR    = el render de la v5 pesaba 19.763 bytes, con tope 20.000. Para hacer lugar salieron cinco
#              frases que ya estaban en otra seccion: de [contenido], «Es un protocolo...» (la oferta y la
#              FAQ «¿De que se trata?»), «Alimenta Tu Tiroides no incluye consulta...» (promesas
#              prohibidas y la FAQ de la consulta) y «Despues de pagar, el acceso llega por correo...»
#              (la FAQ «Ya pague, ¿como entro?»); de la oferta, la nota de la moneda local, que se junto
#              con la otra nota de la moneda; y de los limites sensibles, «no ofrezcas el enlace» al
#              declarar un limite, que dice igual [voz].evitar.
#
# La v5 parte de knowledge-v4.toml (aprobado por Dan el 2026-10-13) y suma dos cosas, sin tocar el
# producto ni el SOUL:
#   RECHAZOS = la decision de Dan del 2026-10-13: (1) cuando hay un rechazo en el contexto, el agente
#              le dice a la persona que puede ver su caso y por que no paso el pago, con palabras
#              simples, y sigue con lo que dice la tabla de ese motivo; (2) la regla de reintentos
#              depende del motivo: cada motivo de la tabla dice si se puede reintentar con la misma
#              tarjeta, nunca mas de un reintento, y quien ya lo intento varias veces o esta
#              bloqueado se deriva. Sale de Marcela en la reunion del 2026-10-12: Hotmart bloquea al
#              usuario despues de mas de tres intentos de pago, por spam o por sospecha de fraude
#              (el link de Stripe que ella menciono no va: no activa el producto en Hotmart,
#              decision del 12/10). EVENTOS al 2026-10-13: 6 PURCHASE_CANCELED de 4 compradores
#              (dos fallaron dos veces, a unos 70 min, y ninguno compro despues); un texto nuevo,
#              «Transação negada pelo banco emissor», que va a «Transaccion rechazada». El agente ve
#              solo el ultimo rechazo, no cuantos van.
#   MRT      = a quien pide una consulta con la doctora: ATT1 no la incluye, y existe Metodo Raizana
#              Tiroidea (MRT), con seguimiento grupal de la doctora (decision del 2026-10-12, con
#              Marcela). Dan, el 2026-10-13: el agente menciona que existe el programa y deriva solo
#              si le preguntan de MRT algo que no puede contestar, como con el resto; sin precio
#              (HOTMART-API: el producto 4634792 se vende en lanzamientos y con precios por pais y
#              por oferta, la ultima venta fue el 2026-08-25) y sin el link del grupo de la clase,
#              que queda para el Automation Expert.
#
# La v4 parte de knowledge-v3.toml (aprobado por Dan el 2026-10-12) y suma dos cosas, sin tocar el
# producto: el cargador de la v1.6.1 acepta todo lo que agrega (notas de la oferta, se_puede_decir,
# promesas_prohibidas y faq).
#   CUPON    = el seguimiento con cupon, abierto a los leads reales el 2026-10-13 a las 03:01Z. Dan,
#              el 2026-10-13: el agente tiene que saber del cupon, no derivarlo; no lo ofrece por su
#              cuenta, salvo a quien ya le llego la plantilla del 10 %: a esa persona le puede volver
#              a ofrecer el cupon y explicarle que es y como se usa. A quien no se le mando, no se le
#              menciona. Reemplaza la decision del 10/10 («el agente no sabe del cupon», README).
#              Los datos: TIROIDES10, 10 %, en todas las ofertas y sin vencimiento (README, «El
#              seguimiento con cupon»); el boton «Usar mi descuento» abre la pagina de pago con el
#              descuento aplicado (offDiscount) y el codigo no va en el texto de la plantilla
#              (plantillas-pendientes.md, decision de Dan del 01/10). Como lo ve el agente: la
#              plantilla sale como el bot de ATT1 (AgentBot 2), asi que entra a la historia como un
#              mensaje de «assistant» con el texto «te reservamos un *10 % de descuento*» (medido el
#              2026-10-13 en la base de Chatwoot, sin leer contenido de leads).
#   ACCESO   = el acceso a ATT1 es para siempre: Marcela en la reunion del 2026-10-12 (Gemini lo
#              transcribio al reves) y Dan lo confirmo ese dia (≈23:40Z, «Es para siempre»).
# (La oferta de MRT y la regla de los intentos, que la v4 dejaba para otra version, estan en la v5.)
#
# La v3 parte de knowledge-v2.toml (aprobado por Dan el 2026-10-09) y suma la seccion de pagos, que
# la ruta «Compra fallida» del SOUL comun del producto v1.6.0 consulta antes de derivar. Sale de la
# decision de Dan del 2026-10-12 («Como se resuelve cada pago que no se completa», en el vault):
#   PANEL    = las capturas de Dan de la configuracion del checkout del producto 5071808, el 12/10
#              ≈12:15 ART. Activos: tarjeta de credito, dos tarjetas, PayPal, Mercado Pago, Kueski
#              Pay, «Debito Bancario» (SPEI en Mexico) y «Boleto Bancario / Medios de pago locales»
#              (OXXO en Mexico). Apagados o sin aplicar a Mexico: tarjeta + OXXO, Google Pay y
#              Apple Pay. Dan: la tabla de pais a medio es de la plataforma, y cada instancia declara
#              lo que tiene activo y su pais principal; nada de SPEI fijo.
#   HOTMART  = la ayuda de Hotmart, leida el 12/10: los 11 motivos de rechazo de tarjeta y lo que
#              recomienda en cada uno (help.hotmart.com/es/article/26817555816077); los medios por
#              pais (/25648853025037: PSE y Efecty en Colombia, PagoEfectivo en Peru, Sencillito y
#              Servipag en Chile; SPEI da un codigo de pago al confirmar la compra; OXXO da una ficha
#              con fecha de vencimiento, y vencida la compra se cancela); la compra en analisis
#              (/216441297).
#   EVENTOS  = webhook_events de la base de ATT1, contados el 12/10 sin datos personales: carritos
#              por pais (Mexico 138 de 193; Colombia 17; Peru y Argentina 8; Estados Unidos y Chile
#              6), compras por medio (en Mexico, tarjeta 31, Mercado Pago 6, PayPal 3 y OXXO 2;
#              fuera de Mexico, tarjeta y PayPal) y los 4 PURCHASE_CANCELED del 11/10, todos con
#              tarjeta: tres «Transaction refused» y uno de Panama en portugues.
# El resto sale de la v2 y de la v1 (sus cabeceras). Detalle dato por dato: knowledge-fuentes.md.

