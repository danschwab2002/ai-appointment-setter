# HOTMART: los 11 motivos de rechazo de tarjeta, con lo que Hotmart le recomienda al comprador,
# adaptado: siempre suma la salida por otro medio. «Llega como» es el texto visto en ATT1 (EVENTOS);
# los demas textos no estan documentados y se suman cuando aparezcan. v5 (RECHAZOS): cada motivo
# dice si se puede reintentar con la misma tarjeta, y una sola vez.
[[pagos.rechazos]]
motivo = "Saldo insuficiente"
como_llega = ["Saldo insuficiente para o cartão informado. Entre em contato com a operadora."]
que_hacer = "La tarjeta no tenía saldo o límite disponible; dilo sin juzgar. Con la misma tarjeta, solo un intento a meses (en México, con crédito). Si no, otra tarjeta u otro medio de su país."

[[pagos.rechazos]]
motivo = "Transacción rechazada"
como_llega = ["Transaction refused", "Transação negada pelo banco emissor"]
que_hacer = "El banco no aprobó el pago y no dijo por qué. Antes de otro intento con esa tarjeta, que habilite las compras en línea en la app del banco o llame al banco. Si no, otra tarjeta u otro medio de su país."

[[pagos.rechazos]]
motivo = "Banco emisor no disponible"
que_hacer = "El banco no respondió en ese momento. Un intento más en unos minutos; si falla, otra tarjeta u otro medio."

[[pagos.rechazos]]
motivo = "Tarjeta no desbloqueada"
que_hacer = "La tarjeta todavía no está activada. Que la active en la app de su banco o con el banco, y recién ahí la intente una vez más."

[[pagos.rechazos]]
motivo = "Datos de la tarjeta incorrectos"
que_hacer = "Algún dato se cargó mal. Que revise en la página de pago el número, la fecha de vencimiento, el código de seguridad y el nombre, y con los datos corregidos lo intente una vez más. Nunca pidas esos datos por el chat."

[[pagos.rechazos]]
motivo = "Restricción en la tarjeta"
que_hacer = "La tarjeta tiene una restricción para esta compra. No sugieras reintentar con ella: que use otra tarjeta o llame al banco; si no, otro medio de su país."

[[pagos.rechazos]]
motivo = "Tarjeta vencida"
que_hacer = "Con esa tarjeta no se puede reintentar: que use una tarjeta vigente u otro medio de su país."

[[pagos.rechazos]]
motivo = "Tarjeta no habilitada para la operación"
que_hacer = "La tarjeta no está habilitada para compras en línea o internacionales. Que las habilite con su banco antes de otro intento, o use otra tarjeta (si es de débito, una de crédito). Si no, otro medio de su país."

[[pagos.rechazos]]
motivo = "Número de cuotas inválido"
que_hacer = "Esa cantidad de meses no está disponible con su tarjeta. En un intento más, que elija otra opción de meses o un solo pago."

[[pagos.rechazos]]
motivo = "Sesión utilizada previamente"
que_hacer = "La sesión de pago venció. Que abra el enlace de nuevo; si te lo pide, se lo envías."

[[pagos.rechazos]]
motivo = "Compra duplicada"
que_hacer = "Hotmart detectó un intento repetido. Ni otro intento ni otro enlace: que revise su correo, porque puede que la compra ya esté hecha."

