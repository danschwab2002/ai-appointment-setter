# Manifiesto de la instancia ATT1 del setter.
# Referencia de cada campo: docs/referencia-manifiesto.md del repo del producto
# (danschwab2002/ai-appointment-setter). Ningun campo de este archivo es secreto.
#
# Fuentes, medidas el 2026-09-28 (UTC):
#   - Hotmart y ofertas: landing publicada (repo draninagarza, src/pages/att1/evg/vsl/ads-a.astro y
#     org-a.astro, origin/main 32efb9a), reporting (lancemos-ia, alimenta-tu-tiroides-att1.yaml) y
#     el script servido en site.metodoraizana.com.mx/alimenta-tu-tiroides-d (off=2uafw5bg, 200).
#   - La landing B del organico, medida el 2026-10-07 a las 20:18Z: site.metodoraizana.com.mx/
#     alimenta-tu-tiroides responde 200 sin redirecciones (con la barra final tambien) y embebe el
#     formulario de GHL UHTaDn8feKiqALhjGFFF; su script arma el checkout de D98014973Y con
#     off=bmaztyhg&checkoutMode=10 recien cuando GHL avisa el envio de ese formulario.
#   - Chatwoot: base de Chatwoot del VPS, solo lectura: cuenta 2 "ATT1", inbox 11 (WhatsApp Cloud,
#     +5217296521530), team 2 "att1 - revision humana".
#   - Plantillas: message_templates del canal 10, sincronizadas por Chatwoot el 2026-10-01 12:55Z
#     (solo definiciones, en evidencia/2026-10-01-catalogo-plantillas-canal-10.json), y releidas por
#     la API de Chatwoot el 2026-10-10 00:34Z: las cinco siguen APPROVED (solo definiciones, en
#     evidencia/2026-10-10-catalogo-plantillas-canal-10.json).

schema = "setter-instancia/v2"
producto = "v1.28.0"

eventos = ["carrito", "pago_fallido", "compra", "entrante", "intencion", "ficha_impresa"]
# "intencion" entra por el adaptador del formulario de GHL (producto v1.2.0, [adaptadores.ghl]):
# el formulario de ATT1 es de GHL y la landing no manda el evento canonico.
# "ficha_impresa" (producto v1.11.0) es la ficha de pago en efectivo de Hotmart
# (PURCHASE_BILLET_PRINTED). Declararla no cambia nada: el webhook la sigue guardando y el worker
# descartandola hasta que se cargue PORTABLE_HOTMART_PAYMENT_SLIP_ENABLED en el archivo del bridge.

[instancia]
tenant_ref = "lancemos"
ally_ref = "att1"
funnel_ref = "att1"
binding_version = 1
marca = "Dra. Nina Garza"
zona_horaria = "America/Mexico_City"   # 60 % del publico es de Mexico (intake-v1.json)

[hotmart]
product_id = 5071808
hotlink = "D98014973Y"
product_name = "Alimenta tu Tiroides"   # checkout publico pay.hotmart.com/D98014973Y, campo name, leido el 2026-09-30 ("tu" en minuscula)
moneda = "USD"
precio = "47"

[[hotmart.ofertas]]
codigo = "gopi6lh7"
site = "metodoraizana"
landing_id = "ads-a"
url = "https://www.metodoraizana.com/att1/evg/vsl/ads-a"
origen = "pauta"
por_defecto = true

# El organico (ManyChat) llega a la landing B, que es donde vive su formulario. El producto admite
# una sola landing por oferta, asi que org-a (www.metodoraizana.com/att1/evg/vsl/org-a, la misma
# oferta, 0 intenciones y 0 envios al 2026-10-07) queda sin conectar. Esta oferta queda en la
# MISMA posicion: el bridge compara la fila del binding con este archivo, tupla por tupla y en
# orden, y con un desfase no arranca. La fila la reata despliegue/base/reatar-bmaztyhg-a-la-landing-b.sql,
# que corre despliegue/base/conectar-organico.sh --aplicar antes del reinicio (README, "El organico").
