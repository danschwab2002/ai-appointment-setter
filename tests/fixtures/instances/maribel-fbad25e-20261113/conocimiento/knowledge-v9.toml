  "La entrada trae `payment_link_action.coupon_applied`. Si es `true`, el enlace que envía el sistema ya trae el 10 % aplicado. Si es `false`, el enlace sale a precio completo: no digas que trae un descuento y no ofrezcas el cupón por tu cuenta.",
