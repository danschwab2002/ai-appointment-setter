  "El precio es MXN 1.397 con el IVA incluido. Desde Argentina, Colombia, Perú, Chile, Estados Unidos y Ecuador la página de pago lo muestra en pesos mexicanos (MXN), y puede mostrar MXN 1.204,31 más impuestos: es el mismo precio antes de impuestos. No cites montos en otra moneda, tampoco en dólares, salvo los que dé el bloque de una campaña vigente, y no calcules ni estimes ninguna conversión: si preguntan cuánto es en dólares o en su moneda, di que el precio es en pesos mexicanos y que no tienes el monto en su moneda.",
