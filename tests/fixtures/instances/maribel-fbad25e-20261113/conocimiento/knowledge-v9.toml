[[pagos.por_pais]]
pais = "México"
transferencia = "SPEI («Débito Bancario» en la página)"
efectivo = "OXXO"

[[pagos.pasos]]
medio = "transferencia SPEI, en México"
pasos = [
  "Abre el enlace de pago y completa tus datos.",
  "Baja hasta las opciones de pago, toca «Más métodos de pago» si aparece, y elige «Débito Bancario», el de SPEI.",
  "Confirma la compra: la página te da los datos para la transferencia.",
  "Haz la transferencia desde la app o la banca en línea de tu banco antes de 3 días.",
  "Se confirma en el momento, y el acceso te llega al correo con el que hiciste la compra.",
]

# CHECKOUT-0124: dentro de las cuotas de la tarjeta, el pago en una se llama «Pago en efectivo» (igual que en la primera instancia).
[[pagos.pasos]]
medio = "efectivo en OXXO, en México"
pasos = [
  "Abre el enlace de pago y completa tus datos.",
  "La página muestra primero la tarjeta: no la llenes. Baja, toca «Más métodos de pago» si aparece, y marca la opción de OXXO. Ojo: la opción «Pago en efectivo» de la tarjeta no es OXXO, es pagar con tarjeta en una sola cuota.",
  "Confirma la compra: la página te da una ficha con un número de referencia, que puedes guardar o imprimir.",
  "Paga en efectivo en cualquier OXXO antes de que venza (3 días), dando el número de referencia en la caja.",
  "La confirmación tarda hasta 3 días hábiles; después el acceso te llega al correo con el que hiciste la compra.",
]

# v9: CHECKOUT-1109. Antes: medio = "Mercado Pago". Solo aparece en Mexico y Argentina.
[[pagos.pasos]]
medio = "Mercado Pago, en México y Argentina"
pasos = [
  "Abre el enlace de pago, completa tus datos, elige Mercado Pago y toca «Comprar ahora».",
  "La página te lleva a Mercado Pago: inicia sesión en tu cuenta y paga ahí, con el saldo o con una tarjeta de tu cuenta.",
  "Si Mercado Pago te rechaza el pago, el motivo te lo muestra Mercado Pago: lo de tu cuenta o tu tarjeta se resuelve ahí.",
  "Cuando se aprueba, el acceso te llega al correo con el que hiciste la compra.",
]

# Los motivos de rechazo de tarjeta de Hotmart (PRIMERA-V11): son de Hotmart, no del negocio.
[[pagos.rechazos]]
motivo = "Saldo insuficiente"
como_llega = ["Saldo insuficiente para o cartão informado. Entre em contato com a operadora."]
que_hacer = "La tarjeta no tenía saldo o límite disponible; dilo sin juzgar. Con la misma tarjeta, solo un intento a meses (con crédito). Si no, otra tarjeta u otro medio de su país."

[[pagos.rechazos]]
motivo = "Transacción rechazada"
como_llega = ["Transaction refused", "Transação negada pelo banco emissor"]
que_hacer = "El banco no aprobó el pago y no dijo por qué. Antes de otro intento con esa tarjeta, que habilite las compras en línea en la app del banco o llame al banco. Si no, otra tarjeta u otro medio de su país."

[[pagos.rechazos]]
motivo = "Banco emisor no disponible"
que_hacer = "El banco no respondió en ese momento. Un intento más en unos minutos; si falla, otra tarjeta u otro medio."

[[pagos.rechazos]]
motivo = "Tarjeta no desbloqueada"
que_hacer = "La tarjeta todavía no está activada. Que la active en la app de su banco o con el banco, y recién ahí la intente una vez más."

[[pagos.rechazos]]
motivo = "Datos de la tarjeta incorrectos"
que_hacer = "Algún dato se cargó mal. Que revise en la página de pago el número, la fecha de vencimiento, el código de seguridad y el nombre tal como figura en la tarjeta, y con los datos corregidos lo intente una vez más. Nunca pidas esos datos por el chat."

[[pagos.rechazos]]
motivo = "Restricción en la tarjeta"
que_hacer = "La tarjeta tiene una restricción para esta compra. No sugieras reintentar con ella: que use otra tarjeta o llame al banco; si no, otro medio de su país."

[[pagos.rechazos]]
motivo = "Tarjeta vencida"
que_hacer = "Con esa tarjeta no se puede reintentar: que use una tarjeta vigente u otro medio de su país."

[[pagos.rechazos]]
motivo = "Tarjeta no habilitada para la operación"
que_hacer = "La tarjeta no está habilitada para compras en línea o internacionales. Que las habilite con su banco antes de otro intento, o use otra tarjeta. Si no, otro medio de su país."

[[pagos.rechazos]]
motivo = "Número de cuotas inválido"
que_hacer = "Esa cantidad de meses no está disponible con su tarjeta. En un intento más, que elija otra opción de meses o un solo pago."

[[pagos.rechazos]]
motivo = "Sesión utilizada previamente"
que_hacer = "La sesión de pago venció. Que abra el enlace de nuevo; si te lo pide, se lo envías."

[[pagos.rechazos]]
motivo = "Compra duplicada"
que_hacer = "Hotmart detectó un intento repetido. Ni otro intento ni otro enlace: que revise su correo, porque puede que la compra ya esté hecha."

[[pagos.rechazos]]
motivo = "Mercado Pago o una transferencia que no se completó (llega sin motivo)"
