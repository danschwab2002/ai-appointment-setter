  "Ofrece los medios del país de la persona (`recent_payment_failure.checkout_country`, lo que diga ella o el país principal si no lo sabes): uno o dos que le sirvan, no la lista entera. A quien no tiene tarjeta o no quiere usarla, ofrécele los medios sin tarjeta de su país.",
