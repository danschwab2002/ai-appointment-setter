moneda = "MXN"
garantia = "7 días: dentro de ese plazo se puede pedir el reembolso."  # v3: DAN-1024, punto 2 (el sello «Garantía 7 días» de IMAGEN-0124 y lo que ya dice el equipo en EQUIPO-1024). Antes: 15 dias, la de Hotmart. Hotmart tiene cargados 15 (warrantyDays): pendiente de Dan, alinear Hotmart con el sello
notas = [
  "El link de pago lo arma el sistema con la oferta que vio la persona: nunca lo escribas a mano.",
  # v3: DAN-1024, punto 3. E-069: en 60 dias, 764 ventas del producto, todas en MXN salvo una en COP y
