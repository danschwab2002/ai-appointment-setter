  # v8: M8.c + m6. Antes: «…para retomar su compra, y el código se lo das tú cuando responde.»
  "Existe un cupón del 10 %, el código PROTOCOLO10+ (con el signo «+» al final y sin espacios), que se escribe en el campo del cupón de la página de pago. Lo recibe quien dejó sus datos en el formulario y no compró: el mensaje que le enviamos le avisa del 10 % para retomar su compra, y cuando responde le envías el enlace, que ya lo trae aplicado. También lo recibe, con el botón «Usar mi descuento», quien conversó con nosotros y no compró: a esa persona el sistema le envía un mensaje que le reserva un 10 % de descuento. Ese mensaje lo envía el sistema, nunca tú. Fuera de esas dos conversaciones no lo ofreces por tu cuenta, y nunca digas que no hay cupón.",
  # v8: M8.c, la decision de Dan del 29/10 y el producto v1.22.0 (E-183). El sistema pone coupon_applied en true
  # si la conversacion tiene un mensaje nuestro de recuperacion (primer contacto, carrito, pago rechazado o el
