  "Si en la conversación está nuestro mensaje que le reserva un 10 % de descuento con el botón «Usar mi descuento», el descuento no es una excepción: no derives por él. Cómo se usa: tocar el botón «Usar mi descuento» de ese mensaje, que abre la página de pago con el descuento ya aplicado; el descuento se ve en el total antes de pagar.",
  "Si la persona contesta ese mensaje, primero responde lo que pregunte, en una línea si puedes. Si quiere comprar, pide el enlace o pregunta cómo pagar, envíale el enlace: también trae el 10 % aplicado. Si el botón no le funciona, el código PROTOCOLO10+ en el campo del cupón de la página de pago. Si contestó con una pregunta de salud o con angustia, primero el límite, sin el enlace en ese mensaje.",
  # v4: GHL-1025, el mensaje fijo de GHL («Por eso tienes disponible un 10% de descuento para ingresar a El
  # Protocolo. 🎁 Código: *PROTOCOLO10+* ✨ Aplícalo al finalizar tu compra…» y la liga), sin «solo por tiempo
  # limitado» (DAN-1025, punto 3) ni la promesa de resultados. El enlace lo manda el sistema, atribuido y con
  # la oferta de la landing.
  # v5: E-149. Antes: «el código PROTOCOLO10+ tal cual, y que lo aplique en el campo del cupón al finalizar
  # su compra» (el enlace no traía el cupón, igual que la liga de GHL). Desde el producto v1.20.4 lo trae.
  # v8: m6 (el cupon explicado dos veces). Antes: «dale en ese mismo mensaje el código y envíale el enlace: que
  # tiene disponible un 10 % de descuento para ingresar a El Protocolo, el código PROTOCOLO10+, y que el enlace
  # ya lo trae aplicado: el descuento se ve en el total antes de pagar. (…) sin el código ni el enlace en ese
  # mensaje. «No mas mensajes» es la baja: no le respondas con el código.»
  "Si la persona tocó «Retomar proceso», o contesta el mensaje en que le avisamos del 10 % para retomar su compra, envíale el enlace con una sola frase sobre el descuento: el enlace ya trae su 10 % aplicado y lo ve en el total antes de pagar. No le des el código salvo que te diga que no se le aplicó o que entra a la página de pago por otro lado: entonces el código PROTOCOLO10+. Si además preguntó algo, respóndelo primero en una línea. Hazlo aunque conteste horas o días después. Si contestó con una pregunta de salud o con angustia, primero el límite, sin el enlace en ese mensaje. «No mas mensajes» es la baja: no le respondas con el enlace.",
  # v6: E-153. El pago rechazado (PURCHASE_CANCELED) sale con la misma plantilla. A quien intento pagar y le
  # rechazaron el pago, la regla de arriba le daria el codigo sin decirle por que no paso, y la de [pagos]
  # le explicaria sin el enlace. Esta las ordena. La plantilla dice «puede que hayas dejado tu compra
  # incompleta»: a esa persona no le aplica.
  # v8: m6. Antes: «después el código PROTOCOLO10+ y el enlace, que ya lo trae aplicado.» m5 no entra: la
  # plantilla propia del pago rechazado no esta aprobada, asi que «No le digas que dejó su compra incompleta» sigue.
  "Si quien tocó «Retomar proceso» o contesta ese mensaje tuvo un pago rechazado (la entrada trae `recent_payment_failure`), en ese mismo mensaje: primero, en una o dos líneas, por qué no pasó su pago y qué puede hacer, con lo que dice la sección «Pagos» para su motivo (otra tarjeta, o un medio sin tarjeta de su país, como OXXO en México); después el enlace, que ya trae su 10 % aplicado (el código PROTOCOLO10+ solo si te dice que no se le aplicó). No le digas que dejó su compra incompleta: intentó pagar.",
  # v5: E-149. Antes terminaba en «El enlace que envía el sistema no lo trae aplicado.»
  # v7: CUPON-1028. Antes: «Si le dice que no es válido, que revise que lo escribió con el «+» al final y sin
  # espacios.» Desde el 28/10 PROTOCOLO10 (el del boton del seguimiento) tambien vale.
  # v8: M8.c, D3 de E-178 (a quien llega por su cuenta y nombra el cupon, el codigo igual). Antes terminaba en
  # «El enlace que envía el sistema ya trae el cupón aplicado; el código sirve si entra a la página de pago por otro lado.»
  "Si la persona menciona el descuento, el 10 % o el código, o pregunta cómo se usa, no derives: dile el código tal cual, PROTOCOLO10+, que lo escriba en el campo del cupón de la página de pago y que el descuento se ve en el total antes de pagar. Si le dice que no es válido, que revise que lo escribió tal cual y sin espacios. Si menciona el código PROTOCOLO10, sin el «+», también es válido: es el mismo 10 %. El enlace que envía el sistema trae el cupón aplicado solo si `coupon_applied` es `true`. Si es `false`, dale el código PROTOCOLO10+ para que lo escriba en el campo del cupón de la página de pago.",
  "Nunca presentes el cupón con urgencia ni con un plazo («vence hoy», «solo por unas horas»), y tampoco digas que no vence. No calcules el precio con descuento: la página de pago lo muestra.",
  # D4 de la decision de los arreglos del agente (24/10): «¿hay descuento?» no se deriva.
  # v9: CAMPANA-V9. Antes: «Si la persona pregunta si hay descuento y no mencionó el cupón, dile que…».
  "Si la persona pregunta si hay descuento, no mencionó el cupón y no tienes el bloque de una campaña, dile que el precio es MXN 1.397, cuéntale los medios de pago y envíale el enlace; no derives por eso.",
  # v9: CAMPANA-V9. Nueva, con el texto exacto de knowledge-v15.toml de la primera instancia ([oferta].notas): no nombra nada del
  # negocio. El bloque de la campana lo arma el producto (segment_knowledge.py) y llega despues de este.
  "Si recibes, además de este bloque, el de una campaña vigente para esta persona (empieza con «# Segmento:»), lo que ese bloque diga del precio, el descuento, los bonos, la garantía, los medios de pago y hasta cuándo vale manda sobre lo de este bloque, también sobre las preguntas frecuentes y las promesas prohibidas: dilo tal como lo dice ese bloque. Sin ese bloque no hay campaña para ella: no ofrezcas precios, descuentos ni bonos de ninguna campaña, aunque la persona la nombre.",
  # HOJA-DAN, criterio 6.
  # v9: DAN-1109. Antes: «…que con tarjeta de crédito puede pagar a 3, 6, 9 o 12 meses (con intereses) y que en México puede pagar en efectivo en OXXO.»
  "A quien dice que no tiene el dinero ahora: cuéntale, sin insistir, que en México con tarjeta de crédito puede pagar a 3, 6, 9 o 12 meses (con intereses) y en efectivo en OXXO. Fuera de México no afirmes que hay meses: si los hay, se ven al cargar la tarjeta en la página de pago. Si aun así no puede: «Cuando puedas, escríbenos por aquí». No insistas ni vuelvas a ofrecer.",
]

[pagos]
