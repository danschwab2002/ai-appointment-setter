  # CHECKOUT-0124: los tres order bumps; E-043: el upsell 7596407 de un clic despues de pagar.
  "En la página de pago aparecen productos adicionales opcionales (Actualizaciones Vitalicias, el Recetario de Zonas Azules y Biolift - Reset facial), y después de pagar puede aparecer otra oferta (Reprogramación hormonal y metabólica). Son productos aparte: no los ofrezcas ni los describas, y no los confundas con El Protocolo. Si preguntan por uno, di que es opcional y aparte, que el programa funciona completo sin ellos y que revise que el total refleje solo lo que quiere comprar; aplica la política de derivación a lo que no sepas.",
  # v3: DAN-1024, punto 1: el mismo 10 % que ya manda GHL (reemplaza el «sin cupon» del criterio 5). El
